<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>404: Not Found</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // This script checks to see if a redirect is present in the query string
    // and converts it back into the correct url and adds it to the
    // browser's history using window.history.replaceState(...),
    // which will cause the browser to load the correct page for an SPA.
    (function (l) {
      if (l.search) {
        var q = {};
        l.search.slice(1).split('&').forEach(function (v) {
          var a = v.split('=');
          q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
        });
        if (q.p !== undefined) {
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + (q.p || '') +
            (q.q ? ('?' + q.q) : '') +
            l.hash
          );
        }
      }
    }(window.location));
  </script>
  <script>
    // Default redirect to home if no SPA redirect logic is needed
    // GitHub Pages returns this for 404s, so we can redirect to the root index.html
    window.location.href = "/web_wwsmind/";
  </script>
</head>

<body>
  Redirecting...
</body>

</html>
